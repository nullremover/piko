name: Piko
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  Piko:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - Package.swift
          - project.yml
          - .github
          - Info.plist
    info:
      path: Info.plist
      properties:
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nullremover.piko
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
